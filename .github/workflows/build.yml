name: Build a-Shell IPA
on: [push]

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Download and Setup Frameworks
        run: |
          # Create the deep directory structure Xcode is looking for
          mkdir -p xcfs/.build/artifacts/xcfs
          mkdir -p Frameworks
          
          chmod +x downloadFrameworks.sh
          ./downloadFrameworks.sh
          
          # Extract and Move frameworks to the expected locations
          if [ -f "pythonInstall.tar.gz" ]; then
            tar -xzf pythonInstall.tar.gz
            # Move extracted frameworks to the xcfs artifacts path
            find . -name "*.xcframework" -exec cp -R {} xcfs/.build/artifacts/xcfs/ \;
          fi

      - name: Build and Archive
        run: |
          PROJ_FILE=$(find . -name "a-Shell.xcodeproj" -print -quit)
          PROJ_DIR=$(dirname "$PROJ_FILE")
          cd "$PROJ_DIR"
          
          xcodebuild -project a-Shell.xcodeproj \
            -scheme "a-Shell" \
            -configuration Release \
            -sdk iphoneos \
            -archivePath ./build/a-Shell.xcarchive \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            clean archive

      - name: Create IPA
        run: |
          APP_PATH=$(find . -name "a-Shell.app" -type d -print -quit)
          mkdir -p Payload
          cp -r "$APP_PATH" Payload/
          zip -r a-Shell-Headless.ipa Payload

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Headless-a-Shell-IPA
          path: a-Shell-Headless.ipa
