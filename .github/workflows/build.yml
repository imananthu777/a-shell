name: Build a-Shell IPA
on: [push]

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Manual Framework Setup
        run: |
          # Create the required deep directory structure
          mkdir -p xcfs/.build/artifacts/xcfs
          mkdir -p Frameworks
          
          # Download the main python archive manually to avoid the Package.swift error
          curl -L https://github.com/holzschu/a-Shell/releases/download/v0.0.1/pythonInstall.tar.gz -o pythonInstall.tar.gz
          
          # Extract everything
          tar -xzf pythonInstall.tar.gz
          
          # Move all xcframeworks found into the artifacts directory
          find . -name "*.xcframework" -exec cp -R {} xcfs/.build/artifacts/xcfs/ \;
          
          # Also check if any need to be in the root Frameworks folder
          cp -R xcfs/.build/artifacts/xcfs/* Frameworks/ 2>/dev/null || true

      - name: Build and Archive
        run: |
          PROJ_FILE=$(find . -name "a-Shell.xcodeproj" -print -quit)
          PROJ_DIR=$(dirname "$PROJ_FILE")
          cd "$PROJ_DIR"
          
          xcodebuild -project a-Shell.xcodeproj \
            -scheme "a-Shell" \
            -configuration Release \
            -sdk iphoneos \
            -archivePath ./build/a-Shell.xcarchive \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            clean archive

      - name: Create IPA
        run: |
          APP_PATH=$(find . -name "a-Shell.app" -type d -print -quit)
          mkdir -p Payload
          cp -r "$APP_PATH" Payload/
          zip -r a-Shell-Headless.ipa Payload

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Headless-a-Shell-IPA
          path: a-Shell-Headless.ipa
