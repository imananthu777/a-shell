name: Build a-Shell IPA
on: [push]

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Build a-Shell
        run: |
          # 1. Manually Download and Extract Frameworks
          # We do this at the root so all sub-projects can find them
          curl -L https://github.com/holzschu/a-Shell/releases/download/v0.0.1/pythonInstall.tar.gz -o pythonInstall.tar.gz
          tar -xzf pythonInstall.tar.gz

          # 2. Find the project and build
          PROJ_FILE=$(find . -name "a-Shell.xcodeproj" -print -quit)
          PROJ_DIR=$(dirname "$PROJ_FILE")
          echo "Building in: $PROJ_DIR"
          
          cd "$PROJ_DIR"
          xcodebuild -project a-Shell.xcodeproj \
            -scheme "a-Shell" \
            -configuration Release \
            -sdk iphoneos \
            -archivePath ./build/a-Shell.xcarchive \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            clean archive

      - name: Create IPA
        run: |
          # Find the app bundle and package it
          APP_PATH=$(find . -name "a-Shell.app" -type d -print -quit)
          mkdir -p Payload
          cp -r "$APP_PATH" Payload/
          zip -r a-Shell-Headless.ipa Payload

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Headless-a-Shell-IPA
          path: a-Shell-Headless.ipa
