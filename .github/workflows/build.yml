name: Build a-Shell IPA
on: [push]

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Download Frameworks
        run: chmod +x downloadFrameworks.sh && ./downloadFrameworks.sh

      - name: Build and Archive
        run: |
          # Find the directory containing the xcodeproj
          PROJ_FILE=$(find . -name "a-Shell.xcodeproj" -print -quit)
          if [ -z "$PROJ_FILE" ]; then
            echo "Error: a-Shell.xcodeproj not found in the repository."
            exit 1
          fi
          PROJ_DIR=$(dirname "$PROJ_FILE")
          echo "Moving to $PROJ_DIR to build..."
          
          cd "$PROJ_DIR"
          xcodebuild -project a-Shell.xcodeproj \
            -scheme "a-Shell" \
            -configuration Release \
            -sdk iphoneos \
            -archivePath ./build/a-Shell.xcarchive \
            CODE_SIGNING_ALLOWED=NO \
            clean archive

      - name: Create IPA
        run: |
          # Find the app bundle inside the archive
          APP_PATH=$(find . -name "a-Shell.app" -type d -print -quit)
          mkdir -p Payload
          cp -r "$APP_PATH" Payload/
          zip -r a-Shell-Headless.ipa Payload

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Headless-a-Shell-IPA
          path: a-Shell-Headless.ipa
