name: Build a-Shell IPA
on: [push]

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Frameworks and Build
        run: |
          # 1. Find the project root
          PROJ_FILE=$(find . -name "a-Shell.xcodeproj" -print -quit)
          PROJ_DIR=$(dirname "$PROJ_FILE")
          echo "Project detected in: $PROJ_DIR"
          cd "$PROJ_DIR"

          # 2. Create the xcfs directory and download frameworks
          # Using the official script provided in the source
          mkdir -p xcfs
          chmod +x downloadFrameworks.sh
          ./downloadFrameworks.sh

          # 3. Final Compilation
          # We include the -sdk and -arch to ensure it targets the phone correctly
          xcodebuild -project a-Shell.xcodeproj \
            -scheme "a-Shell" \
            -configuration Release \
            -sdk iphoneos \
            -archivePath ./build/a-Shell.xcarchive \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            clean archive

      - name: Create IPA
        run: |
          # Detect the .app file and package it
          APP_PATH=$(find . -name "a-Shell.app" -type d -print -quit)
          mkdir -p Payload
          cp -r "$APP_PATH" Payload/
          zip -r a-Shell-Headless.ipa Payload

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Headless-a-Shell-IPA
          path: a-Shell-Headless.ipa
