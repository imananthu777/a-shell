name: Build a-Shell IPA
on: [push]

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Build IPA in Project Root
        run: |
          # 1. Find where the project actually lives
          PROJECT_ROOT=$(dirname $(find . -name "a-Shell.xcodeproj" -print -quit))
          echo "Detected Project Root: $PROJECT_ROOT"
          cd "$PROJECT_ROOT"

          # 2. Setup folders in the correct spot
          mkdir -p xcfs
          mkdir -p Frameworks

          # 3. Download and Extract Frameworks in the correct spot
          curl -L https://github.com/holzschu/a-Shell/releases/download/v0.0.1/pythonInstall.tar.gz -o pythonInstall.tar.gz
          tar -xzf pythonInstall.tar.gz

          # 4. Run the build from the correct directory
          xcodebuild -project a-Shell.xcodeproj \
            -scheme "a-Shell" \
            -configuration Release \
            -sdk iphoneos \
            -archivePath ./build/a-Shell.xcarchive \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            clean archive

          # 5. Prepare the IPA
          APP_PATH=$(find ./build/a-Shell.xcarchive -name "a-Shell.app" -type d -print -quit)
          mkdir -p Payload
          cp -r "$APP_PATH" Payload/
          zip -r ../a-Shell-Headless.ipa Payload

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Headless-a-Shell-IPA
          path: a-Shell-Headless.ipa
