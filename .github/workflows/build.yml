name: Build a-Shell IPA
on: [push]

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Build a-Shell
        run: |
          # 1. Find the project root
          PROJ_FILE=$(find . -name "a-Shell.xcodeproj" -print -quit)
          PROJ_DIR=$(dirname "$PROJ_FILE")
          echo "Project detected in: $PROJ_DIR"
          cd "$PROJ_DIR"

          # 2. Use the official download script (Fixing permissions first)
          chmod +x downloadFrameworks.sh
          ./downloadFrameworks.sh

          # 3. Compile the app
          xcodebuild -project a-Shell.xcodeproj \
            -scheme "a-Shell" \
            -configuration Release \
            -sdk iphoneos \
            -archivePath ./build/a-Shell.xcarchive \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            clean archive

          # 4. Create the IPA
          APP_PATH=$(find ./build/a-Shell.xcarchive -name "a-Shell.app" -type d -print -quit)
          mkdir -p Payload
          cp -r "$APP_PATH" Payload/
          zip -r ../a-Shell-Headless.ipa Payload

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Headless-a-Shell-IPA
          path: a-Shell-Headless.ipa
