name: Build a-Shell IPA
on: [push]

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Download Frameworks
        run: chmod +x downloadFrameworks.sh && ./downloadFrameworks.sh

      - name: Build and Archive
        run: |
          # Automatically find the project file path
          PROJ_PATH=$(find . -name "a-Shell.xcodeproj" -print -quit)
          echo "Found project at: $PROJ_PATH"
          
          xcodebuild -project "$PROJ_PATH" \
            -scheme "a-Shell" \
            -configuration Release \
            -sdk iphoneos \
            -archivePath ./build/a-Shell.xcarchive \
            CODE_SIGNING_ALLOWED=NO \
            clean archive

      - name: Create IPA
        run: |
          # Find the app bundle inside the archive
          APP_PATH=$(find ./build/a-Shell.xcarchive -name "a-Shell.app" -type d -print -quit)
          mkdir -p Payload
          cp -r "$APP_PATH" Payload/
          zip -r a-Shell-Headless.ipa Payload

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Headless-a-Shell-IPA
          path: a-Shell-Headless.ipa
